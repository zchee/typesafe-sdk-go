# Codecov repository configuration: https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        # Report-only until wave W6.3 of the port plan, then blocking.
        informational: true
    patch:
      default:
        target: 90%
        informational: true

ignore:
  - "examples/"
  - "livetests/"
  - "internal/testsupport/"
