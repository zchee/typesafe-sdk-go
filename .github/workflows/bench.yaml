name: Benchmarks

on:
  push:
    branches:
      - main
  # The repository takes no pull requests (ruling R2), so AC-P7's "PR run"
  # is a workflow_dispatch run on the wave branch before it lands, then the
  # main run after it (docs/perf/codspeed.md).
  pull_request:
  workflow_dispatch:

concurrency:
  # One group per main commit, so a later push never cancels or queues behind an
  # earlier main run (plan risk K7 counts the runs on main); other refs share
  # one group per ref and cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  codspeed:
    name: CodSpeed (walltime)
    # Plan decision D4: CodSpeed accepted ubuntu-26.04 on 2026-09-25 (runs
    # 36102193024 and 36102197550, both green), so no runner exception applies.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # CodSpeed authenticates with the job's OIDC id-token when its GitHub App
      # is installed on the repository (owner gate G1); the action has no token
      # input set and no separate OIDC switch.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-go reads go.mod's toolchain line (go1.27.1) before its go line
      # unless GOTOOLCHAIN=local is set (setup-go v7 src/installer.ts,
      # parseGoVersionFile).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # No GOEXPERIMENT. The measurement rule's GOEXPERIMENT=nosimd,noruntimesecret
      # is for a host whose Go env file sets experiments (the maintainer's
      # darwin/arm64 sets simd,runtimesecret); it restores the Go 1.27
      # baseline there. The runner has no such file, so its default already
      # is the baseline, and the report step below prints its ToolTags
      # (docs/support.md#measurement-rule).
      - uses: CodSpeedHQ/action@v5
        env:
          CODSPEED_PERF_UNWINDING_MODE: fp
          # K35: CodSpeed's `testing` overlay keeps one sample per b.Loop
          # iteration, and the go runner reads the raw result files only after
          # the whole `go test ./...` ends, so they pile up in the profile
          # folder under $TMPDIR: 5.9 GiB at 125 rows and the default 3 s. On
          # ubuntu-26.04, /tmp is a tmpfs whose usrquota caps the runner user
          # at 80 % (6.24 GiB), which lost 11 rows; runner.temp is on the disk.
          TMPDIR: ${{ runner.temp }}
        with:
          mode: walltime
          # The action's `go` shim hands every `go test` to codspeed-go-runner,
          # which runs benchmarks only: it keeps -bench and -benchtime, drops any
          # other flag with a warning, and takes the first non-flag argument and
          # everything after it as package patterns (so `-run '^$'` fails with
          # malformed import path "^$"). It then runs the real
          # `go test -bench <p> -benchtime <d> -run=^$ <packages>` itself, so no
          # unit test runs in this job. Source: CodSpeedHQ/codspeed v5.2.1
          # src/executor/helpers/introspected_golang/go.sh (default go-runner
          # 1.3.0); CodSpeedHQ/codspeed-go v1.3.0 go-runner/src/cli.rs and
          # go-runner/src/runner/mod.rs.
          # The log copy feeds the guard below; pipefail keeps go's status.
          run: set -o pipefail; go test -bench=. ./... 2>&1 | tee "${{ runner.temp }}/codspeed.log"

      # K35 guard: the go runner reports a raw result it cannot write only on
      # stderr and still exits 0, and the runner then uploads the rest. Fail
      # when the log holds such a line, or when the benchmarks in the uploaded
      # results differ from the rows `go test -list` expands to (a 1x run).
      # Both checks report before the step fails.
      - name: Check that CodSpeed received every benchmark
        run: |
          set -euo pipefail
          fail=0
          if grep -E 'failed to [a-z ]*raw results' "$RUNNER_TEMP/codspeed.log"; then
            echo "::error title=CodSpeed lost results::the go runner could not write raw results (K35)"
            fail=1
          fi
          # One line per row: the package directory, then the name with its
          # sub-benchmark path (-cpu=1 drops the -GOMAXPROCS suffix).
          go test -run '^$' -bench . -benchtime=1x -cpu=1 ./... |
            awk -v mod="$(go list -m)" '
              /^pkg: / { dir = $2; sub("^" mod, ".", dir) }
              /^Benchmark[^ \t]*[ \t]+[0-9]+[ \t]+[0-9.]+ ns\/op/ { print dir " " $1 }' |
            LC_ALL=C sort >"$RUNNER_TEMP/codspeed-expected.txt"
          # The profile folder is under the CodSpeed step's TMPDIR: the job's
          # temp directory, or /tmp without the setting above.
          shopt -s nullglob
          results=("$RUNNER_TEMP"/profile.*.out/results/*.json /tmp/profile.*.out/results/*.json)
          # The runner names a row <file>::<Benchmark>::<sub>...; map it the same way.
          jq -r '.benchmarks[].uri | split("::") as $u
            | (["."] + ($u[0] | split("/") | .[:-1]) | join("/")) + " " + ($u[1:] | join("/"))' \
            "${results[@]}" /dev/null | LC_ALL=C sort >"$RUNNER_TEMP/codspeed-written.txt"
          expected=$(wc -l <"$RUNNER_TEMP/codspeed-expected.txt")
          written=$(wc -l <"$RUNNER_TEMP/codspeed-written.txt")
          echo "go test -list expansion: $expected rows; CodSpeed results: $written rows in ${#results[@]} files"
          if [ "$expected" -eq 0 ] || ! diff -u "$RUNNER_TEMP/codspeed-expected.txt" "$RUNNER_TEMP/codspeed-written.txt"; then
            echo "::error title=CodSpeed lost results::$written of $expected benchmarks reached the results (K35)"
            fail=1
          fi
          exit "$fail"

      # AC-P7, report-only until K7 is met: no value is compared, so no timing
      # fails the job. CodSpeed's report shows a row's minimum; AC-P7 reads
      # the mean, which is go test's ns/op and AC-P6's basis (ruling R108).
      # The table gives both, and the median, for the BenchmarkCall rows,
      # with the facts a ledger row needs: hosted runners differ in CPU model
      # from run to run. The log also lists every row the results hold, under
      # the name CodSpeed keys its history by. The step fails only when it
      # has nothing to report: no results file, a file jq cannot read, or no
      # BenchmarkCall/sdk or /naive row, since a green job with an empty
      # report is how K35 hid lost rows (Phase 4 critic m-8).
      - name: Report AC-P7 (report-only)
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=("$RUNNER_TEMP"/profile.*.out/results/*.json /tmp/profile.*.out/results/*.json)
          if [ "${#results[@]}" -eq 0 ]; then
            echo "::error title=AC-P7 report::no CodSpeed results file under \$RUNNER_TEMP or /tmp"
            exit 1
          fi
          {
            echo "### AC-P7: \`BenchmarkCall/sdk\` against \`BenchmarkCall/naive\` (report-only, K7)"
            echo
            echo "- \`$(go version)\`, ToolTags \`$(go list -f '{{context.ToolTags}}' runtime)\`"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) CPUs"
            echo
            jq -rs '
              [.[].benchmarks[] | select(.uri | startswith("internal/benchmark/call_test.go::BenchmarkCall::"))
                | {key: (.uri | split("::")[2]), value: .stats}] | from_entries as $c
              | def us($s): if $s == null then "–" else ($s | round / 1000 | tostring) end;
                def ratio($a; $b; $f):
                  if $c[$a] == null or $c[$b] == null then "–"
                  else ($c[$a][$f] / $c[$b][$f] * 1000 | round / 1000 | tostring) end;
                "| `BenchmarkCall` row | min µs | median µs | mean µs | rounds |",
                "| --- | ---: | ---: | ---: | ---: |",
                (["sdk", "naive", "naive-json", "floor", "sdk-q20", "naive-q20", "naive-json-q20", "floor-q20"][] as $r
                  | "| \($r) | \(us($c[$r].min_ns)) | \(us($c[$r].median_ns)) | \(us($c[$r].mean_ns)) | \($c[$r].rounds // "–") |"),
                "",
                "| Ratio, below 1 = sdk faster | min | median | mean (AC-P7, R108) |",
                "| --- | ---: | ---: | ---: |",
                (["", "-q20"][] as $q
                  | "| sdk\($q) / naive\($q) | \(ratio("sdk\($q)"; "naive\($q)"; "min_ns")) | \(ratio("sdk\($q)"; "naive\($q)"; "median_ns")) | \(ratio("sdk\($q)"; "naive\($q)"; "mean_ns")) |")' \
              "${results[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The uploaded rows by name, so two runs' logs can be compared.
          echo "::group::Benchmarks in the uploaded results"
          jq -r '.benchmarks[].uri' "${results[@]}" | LC_ALL=C sort
          echo "::endgroup::"
          missing=$(jq -rs '["sdk", "naive"] - [.[].benchmarks[].uri
            | select(startswith("internal/benchmark/call_test.go::BenchmarkCall::")) | split("::")[2]]
            | join(" ")' "${results[@]}")
          if [ -n "$missing" ]; then
            echo "::error title=AC-P7 report::no BenchmarkCall row in the results for: $missing"
            exit 1
          fi
