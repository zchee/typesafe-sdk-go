name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every commit on main gets its own group, so no main run is cancelled or
# collapsed into a later one (K7 counts main runs); other refs share a group
# per ref and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out typesafe-sdk-python at the pinned upstream commit
        uses: actions/checkout@v7
        with:
          repository: typesafe-ai/typesafe-sdk-python
          ref: 0ffd094c72ed9445223060b24ffd7a56aa781fb4
          path: upstream
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install gofumpt, modernize, staticcheck and govulncheck
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      # gofumpt's exit status is checked on its own: inside test -z "$(...)" a
      # gofumpt failure with empty output would pass.
      - name: gofumpt, modernize, vet, staticcheck, govulncheck, go mod tidy
        run: |
          out="$(gofumpt -extra -l .)"
          if [ -n "$out" ]; then
            printf 'gofumpt -extra would reformat:\n%s\n' "$out"
            exit 1
          fi
          modernize -test ./... && go vet ./... && staticcheck ./... && govulncheck ./... && go mod tidy -diff

      # Import confinement (sonic, unsafe, x/net, JSON libraries), the per-file D1
      # constraint lines and the sonic JIT-path guard (AC-Q4). The test job runs
      # the same tests on every image; this step names them in the lint result.
      - name: internal/codec seam tests
        run: go test -run 'Seam' -count=1 -v ./internal/codec/

      # setup-uv publishes no floating major tag (only vX.Y.Z tags since v8), so
      # the major-only pin rule cannot apply; Dependabot bumps this full version.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Test the checker scripts
        run: uvx --with pyyaml pytest -q -p no:cacheprovider .github/scripts

      - name: Check the port test matrix against the upstream tests
        run: uv run --script .github/scripts/port-test-matrix.py --upstream upstream
      # W6.4 adds --no-planned on the step above when it flips the last
      # planned rows (I1-I3, XD1, XD2, XT1).
      # uncovered-lines.py runs in the test job, which has the coverage profile.

      # XD1: every Go block of README.md and docs/**/*.md sits under an
      # <!-- example: <path> --> marker and equals that file of examples/ byte
      # for byte, and every examples/ source is shown by a block. The
      # examples are packages of this module, so go vet ./... above compiles
      # them.
      - name: Every Go block in README.md and docs/ equals its examples/ source (XD1)
        run: uv run --script .github/scripts/docs-snippets.py --readme README.md --docs docs --examples examples

      - name: Report available dependency updates
        run: go list -m -u all

      # D1 / AC-Q4 / PM5: off the support matrix internal/codec must refuse to
      # compile, and go vet and go build must both exit non-zero with output
      # naming the D1 identifier. -tags go1.28 stands in for a Go 1.28 toolchain.
      - name: D1 refusal off the support matrix
        env:
          D1_IDENTIFIER: typesafe_sdk_go_requires_go1_17_to_go1_27_on_amd64_or_arm64
        run: |
          # The refusal is the expected output. Drop setup-go's Go problem
          # matcher (owner "go") so that it is not reported as an error
          # annotation; this is the lint job's last step for that reason.
          echo "::remove-matcher owner=go::"
          for t in 'GOOS=linux GOARCH=386' 'GOOS=linux GOARCH=riscv64' 'GOFLAGS=-tags=go1.28'; do
            for cmd in vet build; do
              echo "::group::env $t go $cmd ./internal/codec/"
              # $t is split on purpose: env(1) applies each assignment.
              # shellcheck disable=SC2086
              if out="$(env $t go "$cmd" ./internal/codec/ 2>&1)"; then
                printf '%s\n' "$out"
                echo "::error::env $t go $cmd ./internal/codec/ succeeded: the D1 refusal is gone"
                exit 1
              fi
              printf '%s\n' "$out"
              echo "::endgroup::"
              if ! grep -qF "$D1_IDENTIFIER" <<<"$out"; then
                echo "::error::env $t go $cmd ./internal/codec/ failed without naming $D1_IDENTIFIER"
                exit 1
              fi
            done
          done

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC; no token secret exists.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test -race with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      # Allocation counts need a normal build: under -race sync.Pool.Put drops
      # one value in four, so the codec allocation tests skip themselves there
      # (ruling R18).
      - name: go test without -race (allocation tests)
        run: go test -count=1 ./internal/codec/ ./internal/wire/ ./internal/testsupport/

      # The allocation budgets: the root package's, each built with
      # //go:build !race (GOROOT/src/sync/pool.go:104-107: under -race Put
      # drops one value in four), with the AC-P8 time ratio, which also runs
      # in the -race step; and internal/codec's, which skip themselves under
      # -race (the step above runs them too, without their output). Each list
      # is the one place that names its package's tests (plan section 11,
      # ruling R92): the pattern is built from it and the -list guard counts
      # the tests the pattern matches against its length, so a renamed or
      # deleted test fails the step instead of leaving it with less to run;
      # and a test that the step should run but its list lacks fails it too:
      # a test of a root !race file, or an internal/codec test that calls
      # raceEnabled() (review-w5-2 NIT 3).
      - name: go test without -race (allocation budgets)
        run: |
          root=(
            TestAllocPrepare         # Prepare's pinned counts (ruling R50)
            TestAllocFalsyJSON       # Prepare P2: truthy criteria not copied (W5.3)
            TestAllocEncode          # AC-P1 single size, every state kind (W5.2)
            TestAllocScratchSequence # AC-P1 mixed-size sequence (W5.2)
            TestAllocDecodeFixtures  # AC-P2 (W2.0)
            TestLinearityFlood       # AC-P8 allocation ratio and members visited (W2.0)
            TestLinearityFloodTime   # AC-P8 time, every build (W5.2)
            TestAllocWholeCall       # AC-P6, N = 12 (W5.3; 14 at W3.4)
            TestAllocAnswersInlineBound # AC-P6, the inline entries' bound (W5.3)
            TestMemStatsCap          # AC-P5 (W2.3)
            TestAllocResponseJSON    # response payloads (W2.4)
            TestAllocTypedDecode     # AC-P3 (W4.2)
            TestAllocTypedFailure    # a typed failure's error, its path rendered once (W5.3)
            TestAllocLoggedCall      # what logging costs a call (W3.3, ruling R102)
            TestAllocRequestID       # a logged request id's cost (R103 revert)
            TestAllocSecretHeaderName # redaction by name without a copy (W5.3)
          )
          codec=(
            TestEncodeStateAllocations          # AC-P1, the state encode alone (W1.2)
            TestLazyPassAllocations             # AC-P8, c0 + c1 x members visited (W2.0, ruling R110)
            TestNewBodyAllocations              # AC-P1, the sequence's call 23 (W1.2)
            TestPretouchFirstCallCostsAWarmCall # after Pretouch a first encode costs a warm one (W2.3)
          )
          # require_listed WHAT NAMES LIST...: every name of NAMES (one per
          # line) must be in LIST, or no step shows its output.
          require_listed() {
            local what=$1 names=$2
            shift 2
            local missing
            missing="$(comm -23 <(printf '%s\n' "$names" | sort -u) <(printf '%s\n' "$@" | sort -u))"
            if [ -n "$missing" ]; then
              echo "::error::$what missing from the list: ${missing//$'\n'/ }"
              exit 1
            fi
          }
          # A //go:build !race root file is left out of the -race step, so its
          # tests run only here. internal/codec cannot carry that constraint
          # (TestSeamBuildConstraints); its tests skip themselves under -race
          # by calling raceEnabled().
          require_listed "tests built only without -race" \
            "$(grep -l '^//go:build !race' -- *_test.go | xargs grep -ho '^func Test[A-Za-z0-9_]*' | sed 's/^func //' | tr -d '\r')" \
            "${root[@]}"
          require_listed "internal/codec tests that skip under -race" \
            "$(awk '/^func / { name = ($2 ~ /^Test[A-Za-z0-9_]*\(/) ? $2 : ""; sub(/\(.*/, "", name) } /raceEnabled\(\)/ && name != "" { print name }' internal/codec/*_test.go | tr -d '\r')" \
            "${codec[@]}"
          # run_budgets PACKAGE TEST... guards and runs one list.
          run_budgets() {
            local pkg=$1
            shift
            local pattern listed
            pattern="^($(IFS='|'; echo "$*"))\$"
            listed="$(go test -list "$pattern" "$pkg" | grep -c '^Test')" || true
            if [ "$listed" != "$#" ]; then
              echo "::error::go test -list matched ${listed:-no} tests of the $# listed in $pkg: $pattern"
              exit 1
            fi
            go test -count=1 -run "$pattern" -v "$pkg"
          }
          run_budgets . "${root[@]}"
          run_budgets ./internal/codec/ "${codec[@]}"

      # OIDC authentication: the action exchanges the job's id-token (hence
      # `id-token: write` above) and ignores any token input. It needs the Codecov
      # GitHub App installed on the repository (owner gate G1). For a pull request
      # from a fork, which gets no id-token, the action detects the fork
      # (CC_FORK), skips OIDC and uploads without a token under the fork's head
      # label as the branch, the tokenless path Codecov accepts for public
      # repositories.
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # `disable_search` stops the action from walking the tree for other
          # coverage files, so the profile produced above is the only upload.
          files: coverage.out
          disable_search: true
          flags: ${{ matrix.os }}
          # W2.0 produces coverage (plan section 12, ruling R70).
          fail_ci_if_error: true

      # setup-uv publishes no floating major tag (only vX.Y.Z tags since v8), so
      # the major-only pin rule cannot apply; Dependabot bumps this full version.
      - if: matrix.os == 'ubuntu-26.04'
        uses: astral-sh/setup-uv@v10.2.0

      # AC-Q2: every block that the -race step's profile leaves at zero,
      # outside the paths .codecov.yaml ignores, has a row with a reason in
      # docs/uncovered-lines.md, and no row outlives its block. It runs after
      # the upload, so a failure here still leaves Codecov its report, and on
      # one image: the document describes the ubuntu -race profile, and a
      # block that timing covers only sometimes has a range row there.
      - name: Every uncovered block has a reason (AC-Q2)
        if: matrix.os == 'ubuntu-26.04'
        run: uv run --script .github/scripts/uncovered-lines.py --profile coverage.out --doc docs/uncovered-lines.md

  # AC-Q3 (W6.1): every fuzz target for 60 s, in turn, one package per go test
  # -fuzz invocation; the job fails when any target finds an input that fails
  # (a panic, a failed property, or an input past the targets' 10 s
  # per-input bound, internal/testsupport/fuzz.go) and uploads those inputs.
  # The seed corpora (testdata/fuzz) also run in the test job, as tests.
  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The lists are the one place that names the targets: `fuzzed` runs
      # each for FUZZTIME, `seeded` names the targets that run only their
      # seed corpus (in the test job). A target declared in the tree and in
      # neither list, a listed target go test -list does not find, or an
      # empty list fails the step before anything runs, so a new or renamed
      # target cannot drop out of the job unnoticed.
      - name: Fuzz every target
        env:
          FUZZTIME: 60s
        run: |
          fuzzed=(
            "./internal/codec FuzzDecodeResponse" # both response decoders
            "./internal/codec FuzzErrorBody"      # the error-body reader
            "./internal/codec FuzzDecodePaths"    # the visitor vs lazy pass differential
            ". FuzzRetryAfter"                    # the Retry-After parser
            ". FuzzTagGrammar"                    # the struct tag grammar
            ". FuzzFalsyJSON"                     # the falsy-value check (W5.3)
            ". FuzzIsSecretHeader"                # the secret header names (W5.3)
          )
          seeded=(
            "./internal/codec FuzzAppendJSON"  # compaction vs encoding/json (R44)
            "./internal/codec FuzzValidString" # the string check (R44)
            "./internal/wire FuzzAppendJSON"   # compaction invariants (R44)
          )
          if [ "${#fuzzed[@]}" -eq 0 ]; then
            echo "::error::no fuzz target listed"
            exit 1
          fi
          # grep exits 1 for a batch of files without a target; under the
          # step's pipefail that must not end the step.
          declared="$({ git ls-files -z -- '*_test.go' ':(exclude)_spikes/**' | xargs -0 grep -H -o '^func Fuzz[A-Za-z0-9_]*' || true; } |
            sed -E 's|^(.*)/[^/]*_test\.go:func (.*)$|./\1 \2|; s|^[^/]*_test\.go:func (.*)$|. \1|' | sort -u)"
          unlisted="$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "${fuzzed[@]}" "${seeded[@]}" | sort -u))"
          if [ -n "$unlisted" ]; then
            echo "::error::fuzz targets in neither list: $(tr '\n' ',' <<<"$unlisted")"
            exit 1
          fi
          for entry in "${fuzzed[@]}"; do
            read -r pkg target <<<"$entry"
            if [ "$(go test -list "^$target\$" "$pkg" | grep -cx "$target")" != 1 ]; then
              echo "::error::go test -list does not find $target in $pkg"
              exit 1
            fi
          done
          failed=()
          for entry in "${fuzzed[@]}"; do
            read -r pkg target <<<"$entry"
            echo "::group::$target ($pkg) for $FUZZTIME"
            if ! go test -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" "$pkg"; then
              failed+=("$target")
              echo "::error::$target failed"
            fi
            echo "::endgroup::"
          done
          # go test -fuzz writes each failing input to testdata/fuzz/<target>/
          # in its package; collect the new ones for the artifact.
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | while read -r f; do
            echo "failing input $f:"
            cat "$f"
            mkdir -p "$RUNNER_TEMP/fuzz-failures/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/fuzz-failures/$f"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::fuzz targets that failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
